<div class="auth-wrapper flex-center">
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Enter your details to access your account</p>
    </div>

    @if (errorMsg) {
      <div class="alert alert-error">
        {{ errorMsg }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email Address</label>
        <input 
          type="email" 
          formControlName="email"
          class="input-field"
          [class.error]="f['email'].invalid && f['email'].touched"
          placeholder="name@example.com"
        >
        @if (f['email'].invalid && f['email'].touched) {
          <span class="error-text">Please enter a valid email address</span>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          formControlName="password"
          class="input-field"
          [class.error]="f['password'].invalid && f['password'].touched"
          placeholder="••••••••"
        >
        @if (f['password'].invalid && f['password'].touched) {
          <span class="error-text">Password is required</span>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
      Don't have an account? 
      <a routerLink="/auth/register" style="font-weight: 600; color: var(--text-main);">Create account</a>
    </div>
  </div>
</div>
