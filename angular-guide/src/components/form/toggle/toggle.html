<button
  type="button"
  [disabled]="disabled"
  (click)="toggle()"
  class="flex items-center gap-3 disabled:cursor-not-allowed"
>

  <span
    class="relative h-6 w-11 rounded-full transition"
    [class.bg-[#436CF3]]="checked"
    [class.bg-[#D9DFEA]]="!checked"
  >

    <span
      class="absolute top-1 h-4 w-4 rounded-full bg-white shadow transition"
      [class.left-6]="checked"
      [class.left-1]="!checked"
    ></span>

  </span>

  @if (label) {
    <span class="text-sm text-[#101828]">
      {{ label }}
    </span>
  }

</button>
