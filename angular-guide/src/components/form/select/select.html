<select
  [value]="value"
  [disabled]="disabled"
  (change)="onValueChange($event)"
  class="h-11 w-full rounded-lg border border-[#D9DFEA] bg-white px-3.5 text-sm text-[#101828] outline-none transition focus:border-[#436CF3] focus:ring-2 focus:ring-[#EAF1FF] disabled:cursor-not-allowed disabled:bg-[#F7F9FC]"
>

  <option value="" disabled>
    {{ placeholder }}
  </option>

  @for (option of options; track option.value) {

    <option [value]="option.value">
      {{ option.label }}
    </option>

  }

</select>
