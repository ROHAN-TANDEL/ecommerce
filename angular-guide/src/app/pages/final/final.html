<div class="p-6 bg-slate-50 min-h-screen">
  <!-- Live feedback banner -->
  <div *ngIf="lastActionMessage" class="mb-4 flex items-center justify-between rounded-lg border border-blue-200 bg-blue-50 px-4 py-2 text-xs text-blue-700">
    <span><strong>Last event:</strong> {{ lastActionMessage }}</span>
    <span class="text-[10px] text-blue-500">Auto-updates from components</span>
  </div>

  <nexora-vertical-section [columns]="4">

    <!-- 1. Auto Refresh -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Auto Refresh</span>
      <div class="flex items-center gap-2">
        <dt-auto-refresh (refresh)="onRefresh()"></dt-auto-refresh>
        <span class="text-[11px] text-slate-500">Ticks: {{ refreshCount }}</span>
      </div>
    </div>

    <!-- 2. Lock Update -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Lock Update</span>
      <div>
        <dt-lock-update (lock)="onLock($event)"></dt-lock-update>
      </div>
    </div>

    <!-- 3. Table Density -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Density</span>
      <div>
        <dt-density [value]="density" (valueChange)="onDensityChange($event)"></dt-density>
      </div>
    </div>

    <!-- 4. Export Action -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Export</span>
      <div>
        <dt-export (export)="onExport($event)"></dt-export>
      </div>
    </div>

    <!-- 5. Download Action -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Download</span>
      <div>
        <dt-download (download)="onDownload($event)"></dt-download>
      </div>
    </div>

    <!-- 6. Columns Manager -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Columns Manager</span>
      <div>
        <dt-columns-manager (visibilityChange)="onColumnsChange($event)"></dt-columns-manager>
      </div>
    </div>

    <!-- 7. Column Navigation -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Column Stepper</span>
      <div>
        <dt-column-nav [label]="columnScrollIndex + ' of 5 cols'" (navigate)="onColumnNav($event)"></dt-column-nav>
      </div>
    </div>

    <!-- 8. Saved Views Manager -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Saved Views</span>
      <div>
        <dt-views-manager
          [activeView]="activeView"
          (viewChange)="onViewChange($event)"
          (saveView)="onSaveView()"
          (resetView)="onResetView()">
        </dt-views-manager>
      </div>
    </div>

    <!-- 9. Fullscreen Toggle -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Fullscreen</span>
      <div>
        <dt-fullscreen-toggle [(fullscreen)]="isFullscreen"></dt-fullscreen-toggle>
      </div>
    </div>

    <!-- 10. Collapse Toggle -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Table Collapse</span>
      <div>
        <dt-collapse-toggle [(collapsed)]="isCollapsed"></dt-collapse-toggle>
      </div>
    </div>

    <!-- 11. Live Collab Toggle -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Collaboration</span>
      <div>
        <dt-collab-toggle [(active)]="isCollabActive"></dt-collab-toggle>
      </div>
    </div>

    <!-- 12. Edit & Save Action Buttons -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Edit / Save</span>
      <div class="flex items-center gap-1.5">
        <dt-action-button icon="✎" label="Edit" variant="default" (clicked)="onActionClick('Edit')"></dt-action-button>
        <dt-action-button icon="✓" label="Save" variant="primary" (clicked)="onActionClick('Save')"></dt-action-button>
      </div>
    </div>

    <!-- 13. Delete & Revert Buttons -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Delete / Revert</span>
      <div class="flex items-center gap-1.5">
        <dt-action-button icon="🗑" label="Delete" variant="danger" (clicked)="onActionClick('Delete')"></dt-action-button>
        <dt-action-button icon="↶" label="Revert" variant="amber" (clicked)="onActionClick('Revert')"></dt-action-button>
      </div>
    </div>

    <!-- 14. Enable & Disable Buttons -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Enable / Disable</span>
      <div class="flex items-center gap-1.5">
        <dt-action-button icon="✅" label="Enable" variant="success" (clicked)="onActionClick('Enable')"></dt-action-button>
        <dt-action-button icon="⊘" label="Disable" variant="default" (clicked)="onActionClick('Disable')"></dt-action-button>
      </div>
    </div>

    <!-- 15. Copy & Reset Buttons -->
    <div class="flex flex-col gap-1.5 p-3 rounded-xl border border-slate-200 bg-white shadow-sm">
      <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Copy / Reset</span>
      <div class="flex items-center gap-1.5">
        <dt-action-button icon="⎘" label="Copy" variant="default" (clicked)="onActionClick('Copy')"></dt-action-button>
        <dt-action-button icon="↺" label="Reset" variant="default" (clicked)="onActionClick('Reset')"></dt-action-button>
      </div>
    </div>

  </nexora-vertical-section>
</div>
