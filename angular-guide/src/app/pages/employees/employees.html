<div class="min-h-screen bg-[#F8FAFC] text-slate-900 font-sans antialiased p-6 pb-28">
  <div class="max-w-[1400px] mx-auto space-y-4">

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- 1. HEADER SECTION & BUTTONS                                     -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <header-section-component
      *ngIf="tableConfig.show_title_header_section"
      [displayName]="tableConfig.display_name"
      [tableKey]="tableConfig.table_key"
      [apiStatus]="apiStatus"
      description="Component-based data architecture: granular headers, action components, cells, and filters."
    >
      <button-component
        variant="secondary"
        size="md"
        (clicked)="bootstrapTable()"
        title="Re-sync from API"
      >
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Sync API</span>
      </button-component>

      <button-component
        *ngIf="tableConfig.enable_add_data_button"
        variant="primary"
        size="md"
        (clicked)="onHeaderAddDataClick()"
      >
        <svg class="w-3.5 h-3.5 stroke-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>{{ cleanAddButtonName }}</span>
      </button-component>
    </header-section-component>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- 2. ACTION PANEL COMPONENT & INDIVIDUAL ACTION COMPONENTS        -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <action-panel-component
      *ngIf="tableConfig.action_panel"
      [sectionGroups]="sectionGroups"
      (actionSelect)="onActionPanelSelect($event)"
    >
      <!-- Projected Pinned Action Components -->
      <refresh-component (refresh)="bootstrapTable()"></refresh-component>
      <lock-component [locked]="isLocked" (lockToggle)="onLockToggle($event)"></lock-component>
      <edit-component [editing]="isEditModeActive" (edit)="onEditClick()" (editToggle)="onEditToggle($event)"></edit-component>
      <save-component (save)="onSaveClick()"></save-component>
      <density-component [density]="density" (densityChange)="onDensityChange($event)"></density-component>
    </action-panel-component>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- 3. TABLE COMPONENT WITH COMPOSABLE SUB-COMPONENTS               -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <table-component
      [isLoading]="isDataLoading"
      [minHeight]="tableMinHeight"
      [maxHeight]="tableMaxHeight"
    >
      <!-- Table Header Wrapper -->
      <table-header-component *ngIf="tableConfig.show_table_headers" class="contents">
        <!-- Row 1: Column Headers -->
        <tr class="border-b border-slate-200">
          <master-component
            *ngIf="hasCheckboxColumn"
            class="contents"
            [showCheckbox]="enableMasterLevelCheckbox"
            [checked]="selectedRowIds.size === rows.length && rows.length > 0"
            (masterToggle)="toggleSelectAll()"
          ></master-component>

          <header-component
            *ngFor="let col of columnsList"
            class="contents"
            [column]="col"
            [sortDirection]="sortState[col.key]"
            (sortChange)="onHeaderSortClick($event)"
          ></header-component>

          <!-- Action column header -->
          <th
            *ngIf="tableConfig.action_column.active"
            style="width: 110px; min-width: 110px; max-width: 110px;"
            class="w-[110px] min-w-[110px] max-w-[110px] px-3 py-3 bg-slate-50 sticky right-0 z-30 border-l border-slate-200 text-center text-[11px] font-semibold text-slate-700 uppercase tracking-wider"
          >
            Action
          </th>
        </tr>

        <!-- Row 2: Dynamic Filter Row -->
        <filter-row-component
          *ngIf="tableConfig.enable_table_search_filters"
          class="contents"
          [columns]="columnsList"
          [activeFilters]="activeFilters"
          [hasCheckboxColumn]="hasCheckboxColumn"
          [hasActionColumn]="tableConfig.action_column.active"
          (filterChange)="onFilterChange($event)"
          (filterTrigger)="onFilterTrigger($event)"
        ></filter-row-component>

        <!-- Row 3: Secondary Section Row (Directly below Filter Section) -->
        <section-row-component
          class="contents"
          [columns]="columnsList"
          [values]="sectionRowValues"
          [hasCheckboxColumn]="hasCheckboxColumn"
          [hasActionColumn]="tableConfig.action_column.active"
          (sectionChange)="onSectionRowChange($event)"
          (sectionAction)="onSectionRowAction($event)"
        ></section-row-component>
      </table-header-component>

      <!-- Table Body Component -->
      <table-body-component class="contents">
        <!-- Data Rows -->
        <tr
          *ngFor="let row of rows; let i = index; let even = even"
          [class.bg-slate-50]="even && !selectedRowIds.has(row['id'])"
          [class.bg-blue-50]="selectedRowIds.has(row['id'])"
          [class.z-40]="activeRowActionId === row['id']"
          [class.relative]="activeRowActionId === row['id']"
          class="hover:bg-slate-100/70 transition-colors"
        >
          <!-- Row Checkbox Cell -->
          <td
            *ngIf="hasCheckboxColumn"
            style="width: 50px; min-width: 50px; max-width: 50px;"
            class="w-[50px] min-w-[50px] max-w-[50px] px-3 py-3 text-center sticky left-0 z-10 border-r border-slate-200"
            [class.bg-slate-50]="even && !selectedRowIds.has(row['id'])"
            [class.bg-white]="!even && !selectedRowIds.has(row['id'])"
            [class.bg-blue-50]="selectedRowIds.has(row['id'])"
          >
            <input
              *ngIf="enableRowLevelCheckboxes"
              type="checkbox"
              [checked]="selectedRowIds.has(row['id'])"
              (click)="toggleRowSelect($event, row['id'])"
              class="w-3.5 h-3.5 rounded border-slate-300 accent-slate-900 cursor-pointer"
            />
            <span *ngIf="!enableRowLevelCheckboxes" class="text-[11px] text-slate-400 font-mono">
              {{ (pagination.page - 1) * pagination.limit + i + 1 }}
            </span>
          </td>

          <!-- Dynamic Cells Rendered by <cell-component> -->
          <cell-component
            *ngFor="let col of columnsList"
            class="contents"
            [column]="col"
            [row]="row"
            [isEven]="even"
            [isSelected]="selectedRowIds.has(row['id'])"
            [isEditing]="isEditModeActive"
          ></cell-component>

          <!-- Sticky Action Column Cell with Kebab Popover -->
          <td
            *ngIf="tableConfig.action_column.active"
            style="width: 110px; min-width: 110px; max-width: 110px;"
            class="w-[110px] min-w-[110px] max-w-[110px] px-3 text-center sticky right-0 border-l border-slate-200"
            [class.z-40]="activeRowActionId === row['id']"
            [class.z-10]="activeRowActionId !== row['id']"
            [class.bg-slate-50]="even && !selectedRowIds.has(row['id'])"
            [class.bg-white]="!even && !selectedRowIds.has(row['id'])"
            [class.bg-blue-50]="selectedRowIds.has(row['id'])"
          >
            <div class="relative inline-block text-left" (click)="$event.stopPropagation()">
              <button
                type="button"
                (click)="toggleRowActionMenu($event, row['id'])"
                class="inline-flex items-center justify-center w-7 h-7 rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:border-slate-300 shadow-2xs transition-colors cursor-pointer"
                title="Row Actions"
              >
                <svg class="w-3.5 h-3.5 text-slate-500" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="5" r="1.75"></circle>
                  <circle cx="12" cy="12" r="1.75"></circle>
                  <circle cx="12" cy="19" r="1.75"></circle>
                </svg>
              </button>

              <div
                *ngIf="activeRowActionId === row['id']"
                class="absolute right-0 z-50 w-36 rounded-xl border border-slate-200 bg-white p-1 shadow-2xl space-y-0.5 text-left"
                [class.top-full]="!isBottomRow(i)"
                [class.mt-1]="!isBottomRow(i)"
                [class.bottom-full]="isBottomRow(i)"
                [class.mb-1]="isBottomRow(i)"
              >
                <ng-container *ngFor="let opt of tableConfig.action_column.options">
                  <div *ngIf="opt === 'delete'" class="my-1 border-t border-slate-100"></div>
                  <button
                    type="button"
                    (click)="onRowActionClick($event, opt, row)"
                    class="flex w-full items-center px-2.5 py-1.5 text-xs rounded-lg capitalize transition-colors cursor-pointer"
                    [class.text-red-600]="opt === 'delete'"
                    [class.hover:bg-red-50]="opt === 'delete'"
                    [class.text-slate-700]="opt !== 'delete'"
                    [class.hover:bg-slate-100]="opt !== 'delete'"
                  >
                    {{ opt }}
                  </button>
                </ng-container>
              </div>
            </div>
          </td>
        </tr>

        <!-- Table Footer Component (Empty State) -->
        <table-footer-component
          class="contents"
          [showEmptyState]="rows.length === 0 && !isDataLoading"
          [colspan]="columnsList.length + (hasCheckboxColumn ? 1 : 0) + (tableConfig.action_column.active ? 1 : 0)"
        ></table-footer-component>
      </table-body-component>
    </table-component>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- 4. PAGINATION COMPONENT                                         -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <pagination-component
      *ngIf="tableConfig.pagination.active"
      [pagination]="pagination"
      [pageSizeOptions]="tableConfig.pagination.page_size_options"
      [currentCount]="rows.length"
      (pageChange)="onPaginationPageChange($event)"
      (limitChange)="onPaginationLimitChange($event)"
    ></pagination-component>

  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 5. CREATE USER MODAL (End-to-End POST create_api)              -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <div *ngIf="showCreateModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-md w-full p-6 space-y-4 animate-slide-up" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h2 class="text-sm font-bold text-slate-900">{{ cleanAddButtonName }}</h2>
          <p class="text-[11px] text-slate-500">Endpoint: <code>{{ tableConfig.table_api.create_api }}</code></p>
        </div>
        <button type="button" (click)="showCreateModal = false" class="text-slate-400 hover:text-slate-700 text-lg leading-none cursor-pointer">×</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1">First Name</label>
          <input type="text" [(ngModel)]="createForm.first_name" placeholder="John" class="w-full h-8 rounded-lg border border-slate-200 px-3 text-xs outline-none focus:border-slate-900" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Last Name</label>
          <input type="text" [(ngModel)]="createForm.last_name" placeholder="Doe" class="w-full h-8 rounded-lg border border-slate-200 px-3 text-xs outline-none focus:border-slate-900" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Email Address</label>
          <input type="email" [(ngModel)]="createForm.email" placeholder="john.doe@enterprise.io" class="w-full h-8 rounded-lg border border-slate-200 px-3 text-xs outline-none focus:border-slate-900" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Account Status</label>
          <select [(ngModel)]="createForm.status" class="w-full h-8 rounded-lg border border-slate-200 px-2 text-xs outline-none focus:border-slate-900 bg-white">
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" (click)="showCreateModal = false" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 cursor-pointer">
          Cancel
        </button>
        <button type="button" (click)="submitCreateUser()" class="px-4 py-1.5 rounded-lg bg-slate-900 text-xs font-medium text-white hover:bg-slate-800 cursor-pointer shadow-xs">
          Create via API
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 6. EDIT USER MODAL (End-to-End PUT update_api)                  -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <div *ngIf="showEditModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-md w-full p-6 space-y-4 animate-slide-up" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <h2 class="text-sm font-bold text-slate-900">Edit User Record</h2>
          <p class="text-[11px] text-slate-500">Endpoint: <code>{{ tableConfig.table_api.update_api }}</code></p>
        </div>
        <button type="button" (click)="showEditModal = false" class="text-slate-400 hover:text-slate-700 text-lg leading-none cursor-pointer">×</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1">User ID</label>
          <input type="text" [value]="editForm.id" disabled class="w-full h-8 rounded-lg border border-slate-200 bg-slate-100 px-3 text-xs text-slate-500 outline-none" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">First Name</label>
          <input type="text" [(ngModel)]="editForm.first_name" class="w-full h-8 rounded-lg border border-slate-200 px-3 text-xs outline-none focus:border-slate-900" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Last Name</label>
          <input type="text" [(ngModel)]="editForm.last_name" class="w-full h-8 rounded-lg border border-slate-200 px-3 text-xs outline-none focus:border-slate-900" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Email Address</label>
          <input type="email" [(ngModel)]="editForm.email" class="w-full h-8 rounded-lg border border-slate-200 px-3 text-xs outline-none focus:border-slate-900" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Account Status</label>
          <select [(ngModel)]="editForm.status" class="w-full h-8 rounded-lg border border-slate-200 px-2 text-xs outline-none focus:border-slate-900 bg-white">
            <option value="active">Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" (click)="showEditModal = false" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 cursor-pointer">
          Cancel
        </button>
        <button type="button" (click)="submitEditUser()" class="px-4 py-1.5 rounded-lg bg-slate-900 text-xs font-medium text-white hover:bg-slate-800 cursor-pointer shadow-xs">
          Save via API
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- 7. FLOATING TOAST NOTIFICATION SYSTEM (Non-Destructive)         -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <div class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none">
    <div
      *ngFor="let toast of toasts"
      class="pointer-events-auto bg-slate-900/95 backdrop-blur text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-800 flex items-start justify-between gap-3 transform transition-all duration-200 ease-out animate-slide-up"
    >
      <div class="space-y-0.5">
        <div class="text-xs font-semibold text-white tracking-tight flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span>{{ toast.title }}</span>
        </div>
        <div *ngIf="toast.detail" class="text-[11px] text-slate-300 font-mono">
          {{ toast.detail }}
        </div>
      </div>

      <button
        type="button"
        (click)="dismissToast(toast.id)"
        class="text-slate-400 hover:text-white text-base leading-none cursor-pointer"
      >
        ×
      </button>
    </div>
  </div>

</div>
