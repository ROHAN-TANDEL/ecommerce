<div class="min-h-screen bg-[#F3F6FC]">

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- BOOTSTRAPPING SPINNER                                         -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div *ngIf="bootstrapping"
    class="flex h-screen items-center justify-center">
    <div class="flex flex-col items-center gap-4">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-[#436CF3]"></div>
      <p class="text-sm text-slate-400">Loading table configuration…</p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ERROR STATE                                                   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div *ngIf="!bootstrapping && error"
    class="flex h-screen items-center justify-center px-6">
    <div class="rounded-xl border border-red-200 bg-red-50 px-8 py-10 text-center max-w-md">
      <span class="text-4xl">⚠</span>
      <p class="mt-3 text-sm font-medium text-red-700">{{ error }}</p>
      <button type="button"
        class="mt-5 rounded-lg bg-red-600 px-5 py-2 text-sm font-medium text-white
               hover:bg-red-700 transition-colors"
        (click)="bootstrap()">
        Retry
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- MAIN CONTENT                                                  -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div *ngIf="!bootstrapping && !error" class="px-6 py-8">

    <!-- The single, fully-configured DataTable -->
    <dt-table
      title="Customers"
      subtitle="Manage and monitor your customers across all regions."
      [columns]="columns"
      [rows]="rows"
      [tableConfig]="tableConfig"
      [pagination]="pagination"
      [sorts]="sorts"
      [filterValues]="filterValues"
      [loading]="loading"
      [collabUsers]="collabUsers"
      primaryKey="id"
      tableMinWidth="1100px"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (sortChange)="onSortChange($event)"
      (filterChange)="onFilterChange($event)"
      (cellChanged)="onCellChanged($event)"
      (saveRowRequested)="onSaveRow($event)"
      (bulkActionFired)="onBulkAction($event)"
      (rowActionFired)="onRowAction($event)"
      (exportRequested)="onExport($event)"
      (generateRequested)="onGenerate()"
      (downloadRequested)="onDownload($event)"
      (columnsChanged)="onColumnsChanged($event)"
      (selectionChange)="onSelectionChange($event)"
    />

  </div>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TOAST NOTIFICATIONS                                           -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <div class="fixed bottom-5 right-5 z-[70] flex flex-col gap-2 pointer-events-none">
    <div *ngFor="let t of toasts"
      class="pointer-events-auto flex items-center gap-3 rounded-lg border px-4 py-3
             shadow-lg text-xs font-medium animate-slide-up min-w-[240px]"
      [class.border-emerald-200]="t.type === 'success'"
      [class.bg-emerald-50]="t.type === 'success'"
      [class.text-emerald-700]="t.type === 'success'"
      [class.border-red-200]="t.type === 'error'"
      [class.bg-red-50]="t.type === 'error'"
      [class.text-red-700]="t.type === 'error'"
      [class.border-blue-200]="t.type === 'info'"
      [class.bg-blue-50]="t.type === 'info'"
      [class.text-[#436CF3]]="t.type === 'info'">
      <span>
        {{ t.type === 'success' ? '✓' : t.type === 'error' ? '⚠' : 'ℹ' }}
      </span>
      <span class="flex-1">{{ t.message }}</span>
      <button type="button"
        class="opacity-50 hover:opacity-100"
        (click)="dismissToast(t.id)">✕</button>
    </div>
  </div>

</div>
